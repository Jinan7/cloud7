[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
anyhow = "1.0.104"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "rt"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
