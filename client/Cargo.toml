[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
icons = { version = "0.18.3", features = ["leptos"] }
web-sys = { version = "0.3.106", features = ["File", "ReadableStream", "ReadableStreamByobReader", "ReadableStreamDefaultReader"] }
reqwest = { version = "0.13.5", features = ["json"] }
urlencoding = "2.1.3"
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
gloo-file = { version = "0.4.0", features = ["futures"] }
uuid = { version = "1.27.0", features = ["js", "v4"] }
reactive_stores = "0.4.4"
config = "0.15.27"
serde_json = "1.0.151"
aws-sdk-s3 = "1.152.0"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }





